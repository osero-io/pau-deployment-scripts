[profile.default]
src = "script"
out = "out"
libs = ["lib"]
solc_version = '0.8.34'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
remappings = []
fs_permissions = [
    { access = "read", path = "./script/input" },
    { access = "read-write", path = "./script/output" },
]

[fuzz]
runs = 1000

[invariant]
runs = 1
depth = 100

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
